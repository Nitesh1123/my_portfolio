<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitesh Kumar — Software Engineer</title>
    <meta
      name="description"
      content="Nitesh Kumar builds real-time backends, AI tools and data pipelines. Projects include SwiftChat, EquityBot and a retail sales analytics pipeline."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <meta property="og:title" content="Nitesh Kumar — Software Engineer" />
    <meta property="og:description" content="Real-time backends, AI tools and data pipelines." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      (() => {
        const root = document.documentElement;
        root.classList.add("js");
        let theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch {}
        if (theme ? theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches) {
          root.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
